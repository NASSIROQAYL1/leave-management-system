services:
  mysql:
    image: mysql:8.0.39
    container_name: leave-management-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-leave_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-leave_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-leave_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: leave-management-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-leave_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-leave_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-leave_password}
      SPRING_SQL_INIT_MODE: always
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-host.docker.internal}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@company.com}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      APP_FILE_STORAGE_UPLOAD_DIR: /app/uploads
      APP_FILE_STORAGE_MAX_FILE_SIZE: ${APP_FILE_STORAGE_MAX_FILE_SIZE:-5MB}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

volumes:
  mysql_data:
  backend_uploads:
