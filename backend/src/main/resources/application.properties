spring.application.name=leave-management

spring.profiles.default=local

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
app.mail.from=${APP_MAIL_FROM:no-reply@company.com}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration=${APP_JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
app.jwt.refresh-token-expiration=${APP_JWT_REFRESH_TOKEN_EXPIRATION:P7D}
app.jwt.issuer=${APP_JWT_ISSUER:leave-management-system}
app.jwt.access-token-type=${APP_JWT_ACCESS_TOKEN_TYPE:access}
app.jwt.refresh-token-type=${APP_JWT_REFRESH_TOKEN_TYPE:refresh}

app.auth.max-failed-login-attempts=${APP_AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
app.auth.lock-duration=${APP_AUTH_LOCK_DURATION:PT30M}

app.file-storage.upload-dir=${APP_FILE_STORAGE_UPLOAD_DIR:uploads}
app.file-storage.max-file-size=${APP_FILE_STORAGE_MAX_FILE_SIZE:5MB}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html